name: Conversion Extension CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: PHP 8.5
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, tokenizer, dom, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2
      - name: Install exact released dependencies and package tools
        run: composer install --no-interaction --prefer-dist
      - name: Run complete package checks and isolated archive consumer
        run: composer check
      - name: Verify production-only installation and example
        run: |
          composer install --no-dev --prefer-dist --no-interaction --classmap-authoritative
          composer examples
  package-gate:
    name: Package gate
    if: always() && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require the complete package and release regression gate
        env:
          PACKAGE_RESULT: ${{ needs.check.result }}
        run: test "$PACKAGE_RESULT" = success
